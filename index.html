
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CAN SOFTWARE AI</title>
<style>
:root{
  --red:#ff2847;
  --bg:#09090d;
  --panel:#1b111a;
  --line:#75243a;
}
*{box-sizing:border-box}
body{
  margin:0;color:white;
  background:radial-gradient(ellipse at top,#400c20,#09090d 65%);
  font-family:Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{
  cursor:pointer;color:white;background:#27141e;
  border:1px solid var(--line);border-radius:11px;padding:12px;
}
button:hover{border-color:var(--red);box-shadow:0 0 15px #ff284755}
button:disabled{opacity:.5;cursor:wait}
[hidden]{display:none!important}
.app{display:flex;height:100dvh}
aside{
  width:265px;flex-shrink:0;padding:16px;
  display:flex;flex-direction:column;gap:12px;
  background:linear-gradient(#270c19,#0d0b10);
  border-right:1px solid var(--line);
}
.logo{text-align:center}
.logo img{
  width:145px;height:145px;object-fit:contain;
  filter:drop-shadow(0 0 17px #ff284788);
}
.logo h2{font-size:19px;text-shadow:0 0 15px var(--red)}
.logo small{color:#aaa}
.primary{
  background:linear-gradient(120deg,#a90025,#ff304e);
  border-color:#ff6179;font-weight:bold;
  box-shadow:0 0 15px #ff284744;
}
#history{flex:1;overflow:auto;min-height:0}
.history-btn{
  display:block;width:100%;text-align:left;
  margin:4px 0;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;
}
.history-btn.active{border-color:var(--red)}
#userEmail{font-size:12px;color:#aaa;overflow-wrap:anywhere}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{
  display:flex;align-items:center;gap:12px;
  min-height:70px;padding:12px 20px;
  background:#150c14;border-bottom:1px solid var(--line);
}
header img{width:46px;height:46px;object-fit:contain}
header strong{font-size:19px;text-shadow:0 0 14px var(--red)}
header small{display:block;color:#aaa;font-size:11px}
#menu{display:none}
#messages{
  flex:1;overflow:auto;
  padding:20px max(15px,calc((100% - 850px)/2));
}
.welcome{text-align:center;padding-top:7vh}
.welcome img{
  width:min(200px,55vw);
  filter:drop-shadow(0 0 22px #ff284788);
}
.welcome h1{text-shadow:0 0 18px var(--red)}
.welcome p{color:#aaa}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:25px}
.msg{margin:16px 0;line-height:1.7;overflow-wrap:anywhere}
.msg.user{
  width:fit-content;max-width:88%;margin-left:auto;
  background:#2d1521;border:1px solid #76283d;
  border-radius:16px;padding:14px;
}
.msg.assistant{
  background:#191219;border-left:3px solid var(--red);
  padding:14px;border-radius:0 12px 12px 0;
}
.msg .body{white-space:pre-wrap}
.msg img{
  display:block;max-width:100%;max-height:520px;
  object-fit:contain;border-radius:12px;margin:12px 0;
}
.msg a{color:#ff94a5}
.composer{
  padding:12px max(15px,calc((100% - 850px)/2)) 18px;
}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.mode{font-size:13px;padding:10px}
.mode.active{
  background:#59182c;border-color:var(--red);
  box-shadow:0 0 12px #ff284744;
}
.compose{
  display:flex;align-items:end;gap:8px;
  padding:9px;background:#1b121b;
  border:1px solid #a22d49;border-radius:17px;
  box-shadow:0 0 18px #ff284722;
}
textarea{
  flex:1;min-width:0;background:transparent;
  border:0;outline:0;resize:none;color:white;
  padding:10px;max-height:180px;
}
.send{
  width:45px;height:45px;background:var(--red);
  border:0;font-size:20px;
}
#preview{
  display:none;align-items:center;gap:10px;
  margin-bottom:9px;padding:8px;
  border:1px solid var(--line);border-radius:10px;
}
#preview img{width:65px;height:65px;object-fit:cover}
#filename{font-size:12px;overflow-wrap:anywhere}
#removeFile{margin-left:auto}
#status{min-height:22px;color:#ff9baa;font-size:12px;padding:6px}
.auth{
  position:fixed;inset:0;z-index:50;
  display:grid;place-items:center;padding:20px;
  background:radial-gradient(circle,#450d21,#08080c 65%);
}
.auth-card{
  width:100%;max-width:410px;text-align:center;
  padding:28px;background:#171019;
  border:1px solid #b12c48;border-radius:22px;
  box-shadow:0 0 35px #ff284733;
}
.auth-card img{width:140px;height:140px;object-fit:contain}
.auth-card h1{text-shadow:0 0 15px var(--red)}
.auth-card input{
  width:100%;margin:7px 0;padding:13px;
  background:#241820;border:1px solid #6c2b3d;
  color:white;border-radius:10px;
}
.auth-card button{width:100%;margin-top:10px}
#authError{color:#ff9baa}
.credits{max-width:750px;margin:auto;text-align:center;padding:20px 0 45px}
.credits h1{text-shadow:0 0 18px var(--red)}
.credits p{color:#aaa}
.credit-card{
  background:linear-gradient(135deg,#2b101c,#140e16);
  border:1px solid #8c2b43;border-radius:18px;
  padding:24px;margin:15px 0;
  box-shadow:0 0 15px #ff284722;
}
.credit-card h2{margin:8px 0}
.credit-card small{color:#ff9aaa}
.credit-card.featured{
  border:2px solid #ff3655;
  background:linear-gradient(135deg,#5a1029,#21101a);
  box-shadow:0 0 25px #ff284766;
}
.credit-card.featured h2{text-shadow:0 0 14px var(--red)}
.credit-card.maker{
  border-color:#ff6579;box-shadow:0 0 22px #ff284744;
}
.credits-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
}
.credits-grid .credit-card{margin:0}
.section-title{margin:35px 0 18px;color:#ff8296}
@media(max-width:700px){
  aside{
    position:fixed;z-index:20;top:0;bottom:0;left:0;
    transform:translateX(-105%);transition:.2s;
  }
  aside.open{transform:translateX(0)}
  #menu{display:block}
  header{padding:10px}
  header strong{font-size:15px}
  #messages{padding:14px}
  .composer{padding:10px}
  .credits-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="auth" id="auth">
  <div class="auth-card">
    <img src="/logo.png" alt="CAN SOFTWARE AI">
    <h1>CAN SOFTWARE AI</h1>
    <p>Yapay zekâ platformuna hoş geldin.</p>
    <form id="authForm">
      <input id="email" type="email" placeholder="E-posta" required>
      <input id="password" type="password" placeholder="Şifre" minlength="6" required>
      <button class="primary" id="login" type="submit">Giriş Yap</button>
    </form>
    <button id="google">Google ile devam et</button>
    <button id="register">Hesap oluştur</button>
    <p id="authError"></p>
  </div>
</div>

<div class="app">
  <aside id="sidebar">
    <div class="logo">
      <img src="/logo.png" alt="CAN SOFTWARE AI">
      <h2>CAN SOFTWARE AI</h2>
      <small>Geleceğin Yapay Zekâsı</small>
    </div>

    <button class="primary" id="newChat">＋ Yeni Sohbet</button>
    <button id="showChat">💬 Sohbetler</button>
    <button id="showCredits">👑 Yapımcı & Destekçiler</button>

    <div id="history"></div>
    <div id="userEmail"></div>
    <button id="logout">Çıkış Yap</button>
  </aside>

  <main>
    <header>
      <button id="menu">☰</button>
      <img src="/logo.png" alt="Logo">
      <div>
        <strong>CAN SOFTWARE AI</strong>
        <small>AI Sohbet • Görsel • Fotoğraf</small>
      </div>
    </header>

    <div id="messages"></div>

    <div class="composer" id="composer">
      <div class="modes">
        <button class="mode active" id="modeChat">💬 AI Sohbet</button>
        <button class="mode" id="modeImage">🎨 Görsel Oluştur</button>
        <button class="mode" id="modeEdit">🖼️ Fotoğraf Düzenle</button>
      </div>

      <div id="preview">
        <img id="thumb" alt="Fotoğraf">
        <span id="filename"></span>
        <button id="removeFile">✕</button>
      </div>

      <div class="compose">
        <button class="mode" id="attach">＋</button>
        <input id="file" type="file"
          accept="image/png,image/jpeg,image/webp" hidden>
        <textarea id="prompt" rows="2"
          placeholder="CAN SOFTWARE AI'ye mesaj yaz..."></textarea>
        <button class="send" id="send">➤</button>
      </div>
      <div id="status"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module">
const $ = id => document.getElementById(id);

const supa = window.supabase.createClient(
  "https://xllmhgabuzaledxqqufe.supabase.co",
  "sb_publishable_7BnfXFJWwC77ddC8jTXhfA_gvoMYDrL"
);

let user = null;
let chats = [];
let current = null;
let page = "chat";
let mode = "chat";
let file = null;
let previewUrl = null;
let busy = false;
let registerMode = false;

const makeId = () =>
  crypto.randomUUID?.() || Date.now()+"-"+Math.random();

function status(text=""){
  $("status").textContent=text;
}

function active(){
  return chats.find(c=>c.id===current);
}

function save(){
  if(!user)return;

  try{
    const compact=chats.map(c=>({
      ...c,
      messages:c.messages.map(m=>({
        role:m.role,
        content:m.content,
        image:null
      }))
    }));

    localStorage.setItem(
      "can-software-chats-"+user.id,
      JSON.stringify(compact)
    );
  }catch(e){
    console.warn("Sohbet kaydedilemedi",e);
  }
}

function newChat(){
  const c={
    id:makeId(),
    title:"Yeni sohbet",
    messages:[]
  };

  chats.unshift(c);
  current=c.id;
  page="chat";
  save();
  render();
  $("sidebar").classList.remove("open");
}

function setMode(next){
  mode=next;
  page="chat";

  $("modeChat").classList.toggle("active",next==="chat");
  $("modeImage").classList.toggle("active",next==="image");
  $("modeEdit").classList.toggle("active",next==="edit");

  $("prompt").placeholder=
    next==="image"
      ?"Oluşturmak istediğin görseli anlat..."
      :next==="edit"
      ?"Fotoğrafı nasıl değiştireyim? İstediğini yaz..."
      :"CAN SOFTWARE AI'ye mesaj yaz...";

  $("attach").disabled=next==="image";
  render();
}

$("modeChat").onclick=()=>setMode("chat");
$("modeImage").onclick=()=>setMode("image");
$("modeEdit").onclick=()=>setMode("edit");

function add(c,role,content,image=null){
  c.messages.push({role,content,image});
  save();
  if(current===c.id)render();
}

function showCredits(){
  page="credits";
  $("composer").hidden=true;
  $("sidebar").classList.remove("open");

  const root=$("messages");
  root.replaceChildren();

  const wrap=document.createElement("div");
  wrap.className="credits";

  const title=document.createElement("h1");
  title.textContent="👑 Yapımcı & Destekçiler";

  const intro=document.createElement("p");
  intro.textContent="CAN SOFTWARE AI projesine katkıda bulunanlar";

  wrap.append(title,intro);

  function heading(text){
    const h=document.createElement("h2");
    h.className="section-title";
    h.textContent=text;
    wrap.append(h);
  }

  function card(name,subtitle,type=""){
    const el=document.createElement("div");
    el.className="credit-card "+type;

    const icon=document.createElement("div");
    icon.style.fontSize="32px";
    icon.textContent=type==="maker"?"👑":
      type==="featured"?"🔥":"❤️";

    const h=document.createElement("h2");
    h.textContent=name;

    const small=document.createElement("small");
    small.textContent=subtitle;

    el.append(icon,h,small);
    return el;
  }

  heading("👑 KURUCU & YAPIMCI");
  wrap.append(card("AHMET UTKU CAN","CAN SOFTWARE","maker"));

  heading("❤️ DESTEKÇİLERİMİZ");
  wrap.append(card("BRDX FAMILY","Özel Destekçi","featured"));

  const grid=document.createElement("div");
  grid.className="credits-grid";

  [
    "KARTANESİ",
    "KAMİ ÖMER",
    "KAMİ",
    "KAMİ AİLESİ"
  ].forEach(name=>{
    grid.append(card(name,"Değerli Destekçimiz"));
  });

  wrap.append(grid);

  const thanks=document.createElement("p");
  thanks.style.marginTop="35px";
  thanks.textContent="Desteğiniz için teşekkür ederiz. ❤️";
  wrap.append(thanks);

  root.append(wrap);
  root.scrollTop=0;
}

$("showCredits").onclick=showCredits;

$("showChat").onclick=()=>{
  page="chat";
  render();
  $("sidebar").classList.remove("open");
};

function render(){
  const history=$("history");
  const root=$("messages");

  history.replaceChildren();

  for(const c of chats){
    const b=document.createElement("button");
    b.className="history-btn"+(c.id===current?" active":"");
    b.textContent="💬 "+c.title;

    b.onclick=()=>{
      current=c.id;
      page="chat";
      render();
      $("sidebar").classList.remove("open");
    };

    history.append(b);
  }

  if(page==="credits"){
    showCredits();
    return;
  }

  $("composer").hidden=false;
  root.replaceChildren();

  const c=active();

  if(!c||!c.messages.length){
    const welcome=document.createElement("div");
    welcome.className="welcome";

    const logo=document.createElement("img");
    logo.src="/logo.png";

    const h=document.createElement("h1");
    h.textContent="CAN SOFTWARE AI";

    const p=document.createElement("p");
    p.textContent="Sohbet et, görsel oluştur, fotoğraf düzenle.";

    const chips=document.createElement("div");
    chips.className="chips";

    [
      ["💻 Kod Yaz","chat","Bana bir web sitesi yap"],
      ["🎨 Görsel Oluştur","image",
        "Kırmızı neonlu kurt temalı teknoloji görseli"],
      ["🖼️ Fotoğraf Düzenle","edit",
        "Fotoğraftaki adamın yanına gerçekçi bir aslan ekle"]
    ].forEach(([label,m,prompt])=>{
      const b=document.createElement("button");
      b.textContent=label;
      b.onclick=()=>{
        setMode(m);
        $("prompt").value=prompt;
        $("prompt").focus();
      };
      chips.append(b);
    });

    welcome.append(logo,h,p,chips);
    root.append(welcome);
    return;
  }

  for(const m of c.messages){
    const el=document.createElement("div");
    el.className="msg "+m.role;

    const body=document.createElement("div");
    body.className="body";
    body.textContent=m.content||"";
    el.append(body);

    if(m.image){
      const img=document.createElement("img");
      img.src=m.image;
      img.alt="CAN SOFTWARE AI görseli";
      el.append(img);

      const link=document.createElement("a");
      link.href=m.image;
      link.download="can-software-ai.png";
      link.textContent="⬇ Görseli indir";
      el.append(link);
    }

    root.append(el);
  }

  root.scrollTop=root.scrollHeight;
}

function setUser(u){
  if(user?.id===u?.id)return;

  user=u;
  $("auth").hidden=!!u;

  if(!u){
    chats=[];
    current=null;
    render();
    return;
  }

  $("userEmail").textContent=u.email||"Hesabım";

  try{
    chats=JSON.parse(
      localStorage.getItem("can-software-chats-"+u.id)||"[]"
    );
    if(!Array.isArray(chats))chats=[];
  }catch{
    chats=[];
  }

  chats=chats.filter(c=>c&&Array.isArray(c.messages));

  if(chats.length){
    current=chats[0].id;
    render();
  }else{
    newChat();
  }
}

$("authForm").onsubmit=async e=>{
  e.preventDefault();

  const email=$("email").value.trim();
  const password=$("password").value;

  $("authError").textContent="";

  const result=registerMode
    ?await supa.auth.signUp({email,password})
    :await supa.auth.signInWithPassword({email,password});

  $("authError").textContent=
    result.error?.message||
    (registerMode&&!result.data.session
      ?"E-posta doğrulama bağlantını kontrol et.":"");
};

$("register").onclick=()=>{
  registerMode=!registerMode;
  $("login").textContent=registerMode?"Üye Ol":"Giriş Yap";
  $("register").textContent=
    registerMode?"Giriş ekranına dön":"Hesap oluştur";
};

$("google").onclick=async()=>{
  const {error}=await supa.auth.signInWithOAuth({
    provider:"google",
    options:{redirectTo:location.origin}
  });

  if(error)$("authError").textContent=error.message;
};

$("logout").onclick=async()=>{
  const {error}=await supa.auth.signOut();
  if(error)status(error.message);
};

supa.auth.onAuthStateChange((event,session)=>{
  setUser(session?.user||null);
});

supa.auth.getSession().then(({data})=>{
  setUser(data.session?.user||null);
});

$("newChat").onclick=newChat;

$("menu").onclick=()=>{
  $("sidebar").classList.toggle("open");
};

$("attach").onclick=()=>{
  if(mode!=="image")$("file").click();
};

function clearFile(){
  file=null;

  if(previewUrl){
    URL.revokeObjectURL(previewUrl);
  }

  previewUrl=null;
  $("file").value="";
  $("preview").style.display="none";
}

$("removeFile").onclick=clearFile;

$("file").onchange=()=>{
  const f=$("file").files?.[0];
  if(!f)return;

  if(!["image/png","image/jpeg","image/webp"].includes(f.type)){
    status("JPG, PNG veya WEBP yükle.");
    return;
  }

  if(f.size>3*1024*1024){
    status("AI düzenleme için fotoğraf en fazla 3 MB olmalı.");
    return;
  }

  clearFile();

  file=f;
  previewUrl=URL.createObjectURL(f);
  $("thumb").src=previewUrl;
  $("filename").textContent=f.name;
  $("preview").style.display="flex";

  if(mode==="chat")setMode("edit");
  status("Fotoğraf seçildi. İstediğin düzenlemeyi yaz.");
};

async function chat(message,history){
  const r=await fetch("/api/chat",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({message,history})
  });

  const data=await r.json();

  if(!r.ok)throw Error(data.error||"Sohbet hatası");

  return {
    reply:data.reply||"Boş yanıt.",
    truncated:!!data.truncated
  };
}

async function generateImage(prompt){
  const r=await fetch("/api/generate-image",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({prompt})
  });

  if(!r.ok){
    let error="Görsel oluşturulamadı.";
    try{
      const data=await r.json();
      error=data.error||error;
    }catch{}
    throw Error(error);
  }

  const type=r.headers.get("content-type")||"";

  if(!type.startsWith("image/")){
    throw Error("Sunucu geçerli görsel döndürmedi.");
  }

  const blob=await r.blob();

  if(!blob.size)throw Error("Boş görsel alındı.");

  return URL.createObjectURL(blob);
}

// GERÇEK AI FOTOĞRAF DÜZENLEME BAĞLANTISI
async function editImage(selected,command){
  if(selected.size>3*1024*1024){
    throw Error("Fotoğraf 3 MB'den küçük olmalı.");
  }

  status("✨ AI fotoğrafını düzenliyor...");

  const base64=await new Promise((resolve,reject)=>{
    const reader=new FileReader();

    reader.onload=()=>{
      resolve(reader.result.split(",")[1]);
    };

    reader.onerror=()=>{
      reject(Error("Fotoğraf okunamadı."));
    };

    reader.readAsDataURL(selected);
  });

  const response=await fetch("/api/edit-image",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      image:base64,
      prompt:command
    })
  });

  let data;

  try{
    data=await response.json();
  }catch{
    throw Error("Fotoğraf düzenleme servisi geçersiz yanıt verdi.");
  }

  if(!response.ok){
    throw Error(data.error||"AI fotoğraf düzenleyemedi.");
  }

  if(
    typeof data.url!=="string"||
    !data.url.startsWith("https://")
  ){
    throw Error("Düzenlenmiş fotoğraf bulunamadı.");
  }

  return data.url;
}

async function send(){
  if(busy)return;

  const message=$("prompt").value.trim();

  if(!message){
    status("Önce mesaj yaz.");
    return;
  }

  const c=active();
  if(!c)return;

  const selected=file;
  const selectedMode=mode;

  if(selectedMode==="edit"&&!selected){
    status("Önce fotoğraf yükle.");
    return;
  }

  const history=c.messages
    .slice(-10)
    .map(m=>({
      role:m.role,
      content:m.content
    }));

  if(c.title==="Yeni sohbet"){
    c.title=message.slice(0,45);
  }

  busy=true;
  $("send").disabled=true;
  $("prompt").value="";
  clearFile();

  add(c,"user",
    (selected?"📷 Fotoğraf yüklendi\n":"")+message
  );

  try{
    if(selectedMode==="image"){
      status("🎨 Görsel oluşturuluyor...");

      const result=await generateImage(message);

      add(c,"assistant","🎨 Görsel oluşturuldu.",result);

    }else if(selectedMode==="edit"){
      status("✨ Yapay zekâ fotoğrafı düzenliyor...");

      const result=await editImage(selected,message);

      add(c,"assistant","✨ Fotoğraf düzenlendi.",result);

    }else{
      status("CAN SOFTWARE AI düşünüyor...");

      const answer=await chat(message,history);

      add(c,"assistant",
        answer.reply+
        (answer.truncated
          ?"\n\n⚠️ Yanıt sınırına ulaşıldı. Devamını isteyebilirsin."
          :"")
      );
    }

    status("");

  }catch(error){
    add(c,"assistant",
      "⚠️ İşlem tamamlanamadı: "+error.message
    );
    status(error.message);

  }finally{
    busy=false;
    $("send").disabled=false;
  }
}

$("send").onclick=send;

$("prompt").onkeydown=e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    send();
  }
};

setMode("chat");
</script>
</body>
</html>
