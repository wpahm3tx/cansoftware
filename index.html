
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CAN SOFTWARE AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:white;font-family:Arial,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;border:0;border-radius:10px;padding:11px;background:#292b31;color:white}
button:hover{background:#41434b}
button:disabled{opacity:.5}
.app{display:flex;height:100dvh}
aside{width:245px;background:#18191e;padding:17px;display:flex;flex-direction:column;gap:15px}
.brand{font-size:19px;font-weight:bold;color:#ff4545}
.brand small{display:block;color:#aaa;font-size:11px;margin-top:5px}
#history{flex:1;overflow:auto}
#history button{display:block;width:100%;text-align:left;margin:5px 0}
main{flex:1;min-width:0;display:flex;flex-direction:column}
header{padding:19px;border-bottom:1px solid #333;font-weight:bold}
#messages{flex:1;overflow:auto;padding:20px max(15px,calc((100% - 780px)/2))}
.msg{margin:15px 0;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.user{background:#292b31;border-radius:15px;padding:14px;margin-left:auto;max-width:85%;width:fit-content}
.msg.assistant{padding:10px}
.msg img{max-width:100%;max-height:450px;border-radius:12px;display:block;margin:10px 0}
.msg a{color:#ff7373}
.composer{padding:15px max(15px,calc((100% - 780px)/2))}
.compose{display:flex;align-items:end;gap:8px;border:1px solid #484950;border-radius:18px;padding:10px}
textarea{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;resize:none;padding:10px}
.send{background:#bd202b}
#preview{display:none;margin:8px 0;align-items:center;gap:10px}
#preview img{width:60px;height:60px;object-fit:cover;border-radius:9px}
#status{color:#ff9292;font-size:12px;padding:7px}
.auth{position:fixed;inset:0;z-index:20;background:#101114;display:grid;place-items:center;padding:20px}
.auth[hidden]{display:none}
.auth-card{width:100%;max-width:380px;background:#1d1e24;border:1px solid #444;padding:30px;border-radius:20px}
.auth-card input{width:100%;margin:7px 0;padding:13px;background:#292b31;color:white;border:1px solid #555;border-radius:9px}
.auth-card button{width:100%;margin-top:10px}
#menu{display:none}
@media(max-width:650px){
aside{position:fixed;z-index:5;top:0;bottom:0;left:0;transform:translateX(-105%);transition:.2s}
aside.open{transform:translateX(0)}
#menu{display:inline-block}
header{padding:12px}
#messages{padding:12px}
.composer{padding:10px}
}
</style>
</head>
<body>

<div class="auth" id="auth">
 <div class="auth-card">
  <h1 style="color:#ff4545">CAN SOFTWARE AI</h1>
  <p>Yapay zekâ platformuna hoş geldin.</p>
  <form id="authForm">
   <input id="email" type="email" placeholder="E-posta" required>
   <input id="password" type="password" placeholder="Şifre" minlength="6" required>
   <button type="submit" id="login">Giriş yap</button>
  </form>
  <button id="google">Google ile devam et</button>
  <button id="register">Hesap oluştur</button>
  <p id="authError" style="color:#ff9292"></p>
 </div>
</div>

<div class="app">
 <aside id="sidebar">
  <div class="brand">
   🐺 CAN SOFTWARE AI
   <small>Yapay Zekâ Platformu</small>
  </div>
  <button id="newChat">＋ Yeni sohbet</button>
  <div id="history"></div>
  <div id="userEmail"></div>
  <button id="logout">Çıkış yap</button>
 </aside>

 <main>
  <header>
   <button id="menu">☰</button>
   🐺 CAN SOFTWARE AI
  </header>

  <div id="messages">
   <h2 style="text-align:center;margin-top:15vh">
    CAN SOFTWARE AI
   </h2>
   <p style="text-align:center;color:#aaa">
    Sohbet et veya fotoğraf yükleyip düzenle.
   </p>
  </div>

  <div class="composer">
   <div id="preview">
    <img id="thumb" alt="Fotoğraf">
    <span id="filename"></span>
    <button id="removeFile">✕</button>
   </div>
   <div class="compose">
    <button id="attach">＋</button>
    <input type="file" id="file" accept="image/*" hidden>
    <textarea id="prompt" rows="2"
     placeholder="Mesaj yaz veya fotoğraf düzenleme komutu ver..."></textarea>
    <button class="send" id="send">➤</button>
   </div>
   <div id="status"></div>
  </div>
 </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module">
const $ = id => document.getElementById(id);

const supa = window.supabase.createClient(
 "https://xllmhgabuzaledxqqufe.supabase.co",
 "sb_publishable_7BnfXFJWwC77ddC8jTXhfA_gvoMYDrL"
);

let user=null;
let chats=[];
let current=null;
let file=null;
let previewUrl=null;
let busy=false;
let registerMode=false;

const id=()=>crypto.randomUUID();

function save(){
 if(user){
  try{
   localStorage.setItem(
    "can-software-chats-"+user.id,
    JSON.stringify(chats)
   );
  }catch(e){console.warn(e)}
 }
}

function active(){
 return chats.find(c=>c.id===current);
}

function newChat(){
 const c={
  id:id(),
  title:"Yeni sohbet",
  messages:[]
 };
 chats.unshift(c);
 current=c.id;
 save();
 render();
 $("sidebar").classList.remove("open");
}

function render(){
 const history=$("history");
 const root=$("messages");
 history.replaceChildren();
 root.replaceChildren();

 for(const c of chats){
  const b=document.createElement("button");
  b.textContent="💬 "+c.title;
  b.onclick=()=>{
   current=c.id;
   render();
   $("sidebar").classList.remove("open");
  };
  history.append(b);
 }

 const c=active();

 if(!c || !c.messages.length){
  const h=document.createElement("h2");
  h.textContent="Bugün sana nasıl yardımcı olabilirim?";
  h.style.textAlign="center";
  h.style.marginTop="15vh";
  root.append(h);
  return;
 }

 for(const m of c.messages){
  const el=document.createElement("div");
  el.className="msg "+m.role;

  const t=document.createElement("div");
  t.textContent=m.content;
  el.append(t);

  if(m.image){
   const img=document.createElement("img");
   img.src=m.image;
   img.alt="Düzenlenmiş fotoğraf";
   el.append(img);

   const a=document.createElement("a");
   a.href=m.image;
   a.download="can-software-fotograf.png";
   a.textContent="Fotoğrafı indir";
   el.append(a);
  }

  root.append(el);
 }
 root.scrollTop=root.scrollHeight;
}

function add(c,role,content,image){
 c.messages.push({role,content,image});
 save();
 if(current===c.id)render();
}

function status(t){
 $("status").textContent=t||"";
}

function setUser(u){
 if(user?.id===u?.id)return;
 user=u;
 $("auth").hidden=!!u;

 if(!u){
  chats=[];
  current=null;
  return;
 }

 $("userEmail").textContent=u.email||"Hesabım";

 try{
  chats=JSON.parse(
   localStorage.getItem("can-software-chats-"+u.id)||"[]"
  );
  if(!Array.isArray(chats))chats=[];
 }catch(e){chats=[]}

 chats=chats.filter(c=>c && Array.isArray(c.messages));
 if(chats.length){
  current=chats[0].id;
  render();
 }else{
  newChat();
 }
}

$("authForm").onsubmit=async e=>{
 e.preventDefault();
 const email=$("email").value;
 const password=$("password").value;
 const result=registerMode
  ? await supa.auth.signUp({email,password})
  : await supa.auth.signInWithPassword({email,password});

 $("authError").textContent=result.error?.message||
 (registerMode&&!result.data.session
  ?"E-posta doğrulama bağlantını kontrol et.":"");
};

$("register").onclick=()=>{
 registerMode=!registerMode;
 $("login").textContent=registerMode?"Üye ol":"Giriş yap";
 $("register").textContent=registerMode
  ?"Giriş ekranına dön":"Hesap oluştur";
};

$("google").onclick=async()=>{
 const {error}=await supa.auth.signInWithOAuth({
  provider:"google",
  options:{redirectTo:location.origin}
 });
 if(error)$("authError").textContent=error.message;
};

$("logout").onclick=async()=>{
 const {error}=await supa.auth.signOut();
 if(error)status(error.message);
};

supa.auth.onAuthStateChange((event,session)=>{
 setUser(session?.user||null);
});

supa.auth.getSession().then(({data})=>{
 setUser(data.session?.user||null);
});

$("newChat").onclick=newChat;
$("menu").onclick=()=>{
 $("sidebar").classList.toggle("open");
};

$("attach").onclick=()=>$("file").click();

$("file").onchange=()=>{
 const f=$("file").files?.[0];
 if(!f)return;

 if(!["image/jpeg","image/png","image/webp"].includes(f.type)){
  status("JPG, PNG veya WEBP yükle.");
  return;
 }
 if(f.size>12*1024*1024){
  status("En fazla 12 MB fotoğraf yükle.");
  return;
 }

 clearFile();
 file=f;
 previewUrl=URL.createObjectURL(f);
 $("thumb").src=previewUrl;
 $("filename").textContent=f.name;
 $("preview").style.display="flex";
 status("Fotoğraf seçildi. Düzenleme komutunu yaz.");
};

function clearFile(){
 file=null;
 if(previewUrl)URL.revokeObjectURL(previewUrl);
 previewUrl=null;
 $("file").value="";
 $("preview").style.display="none";
}
$("removeFile").onclick=clearFile;

async function chat(message,history){
 const r=await fetch("/api/chat",{
  method:"POST",
  headers:{"Content-Type":"application/json"},
  body:JSON.stringify({message,history})
 });
 const data=await r.json();
 if(!r.ok)throw Error(data.error||"Sohbet API hatası");
 return data.reply||"Boş yanıt alındı.";
}

async function imageFromBlob(blob){
 return await createImageBitmap(blob);
}

async function editImage(f,command){
 const p=command.toLocaleLowerCase("tr-TR");

 const removeBg=/arka planı kaldır|arkaplanı kaldır|arka plan sil|şeffaf/i.test(p);
 const whiteBg=/arka planı beyaz|beyaz arka plan/i.test(p);
 const blackBg=/arka planı siyah|siyah arka plan/i.test(p);
 const redBg=/arka planı kırmızı|kırmızı arka plan/i.test(p);
 const blueBg=/arka planı mavi|mavi arka plan/i.test(p);

 const bgTask=removeBg||whiteBg||blackBg||redBg||blueBg;
 const grayscale=/siyah beyaz|gri ton/i.test(p);
 const sepia=/sepya|eskit/i.test(p);
 const bright=/aydınlat|parlaklık artır/i.test(p);
 const dark=/karart|parlaklık azalt/i.test(p);
 const contrast=/kontrast artır/i.test(p);
 const blur=/bulanıklaştır/i.test(p);
 const mirror=/ayna|yatay çevir/i.test(p);

 if(!bgTask&&!grayscale&&!sepia&&!bright&&!dark&&!contrast&&!blur&&!mirror){
  throw Error(
   "Bu ücretsiz sürüm şu komutları destekliyor: " +
   "arka planı kaldır, arka planı beyaz/siyah/kırmızı/mavi yap, " +
   "siyah beyaz yap, aydınlat, karart, kontrast artır, " +
   "bulanıklaştır, sepya ve yatay çevir."
  );
 }

 let source=f;

 if(bgTask){
  status("Yapay zekâ modeli yükleniyor. İlk işlem uzun sürebilir...");

  const module=await import(
   "https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.7.0/+esm"
  );

  const removeBackground=module.default||module.removeBackground;

  if(typeof removeBackground!=="function"){
   throw Error("Arka plan kaldırma modülü yüklenemedi.");
  }

  source=await removeBackground(f,{
   model:"isnet_quint8"
  });
 }

 const bitmap=await imageFromBlob(source);

 try{
  const scale=Math.min(
   1,1600/Math.max(bitmap.width,bitmap.height)
  );

  const canvas=document.createElement("canvas");
  canvas.width=Math.round(bitmap.width*scale);
  canvas.height=Math.round(bitmap.height*scale);
  const ctx=canvas.getContext("2d");

  if(whiteBg||blackBg||redBg||blueBg){
   ctx.fillStyle=whiteBg?"#ffffff":
    blackBg?"#000000":
    redBg?"#d71920":"#1465e8";
   ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  const filters=[];
  if(grayscale)filters.push("grayscale(1)");
  if(sepia)filters.push("sepia(1)");
  if(bright)filters.push("brightness(1.35)");
  if(dark)filters.push("brightness(0.65)");
  if(contrast)filters.push("contrast(1.4)");
  if(blur)filters.push("blur(3px)");

  ctx.filter=filters.join(" ")||"none";

  if(mirror){
   ctx.translate(canvas.width,0);
   ctx.scale(-1,1);
  }

  ctx.drawImage(bitmap,0,0,canvas.width,canvas.height);

  return canvas.toDataURL("image/png");
 }finally{
  bitmap.close();
 }
}

async function send(){
 if(busy)return;
 const message=$("prompt").value.trim();
 if(!message)return status("Mesaj yaz.");

 const c=active();
 if(!c)return;

 const selected=file;
 const history=c.messages.slice(-10).map(m=>({
  role:m.role,
  content:m.content
 }));

 if(c.title==="Yeni sohbet")c.title=message.slice(0,40);

 busy=true;
 $("send").disabled=true;
 $("prompt").value="";
 clearFile();

 add(c,"user",
  (selected?"📷 Fotoğraf yüklendi\n":"")+message
 );

 try{
  if(selected){
   status("Fotoğraf düzenleniyor...");
   const result=await editImage(selected,message);
   add(c,"assistant","Fotoğraf düzenlendi.",result);
  }else{
   status("CAN SOFTWARE AI düşünüyor...");
   const answer=await chat(message,history);
   add(c,"assistant",answer);
  }
  status("");
 }catch(e){
  add(c,"assistant","⚠️ İşlem tamamlanamadı: "+e.message);
  status(e.message);
 }finally{
  busy=false;
  $("send").disabled=false;
 }
}

$("send").onclick=send;
$("prompt").onkeydown=e=>{
 if(e.key==="Enter"&&!e.shiftKey){
  e.preventDefault();
  send();
 }
};
</script>
</body>
</html>
